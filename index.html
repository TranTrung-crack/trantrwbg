<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ʚTran Trungɞ</title>
    <style>
        /* RESET toàn màn hình */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: #111; /* nền tối phụ, nhưng splash sẽ che */
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ---- LỚP SPLASH CHE TOÀN BỘ MÀN HÌNH ---- */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000; /* nền đen */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999; /* cực cao để đè lên mọi thứ */
            /* Viền cầu vồng động */
            border: 8px solid transparent;
            box-sizing: border-box;
            animation: rainbow-border 2s linear infinite;
            transition: opacity 0.8s ease;
        }

        /* Hiệu ứng viền cầu vồng chạy */
        @keyframes rainbow-border {
            0% { border-image: linear-gradient(0deg, red, orange, yellow, green, blue, indigo, violet) 1; }
            20% { border-image: linear-gradient(36deg, red, orange, yellow, green, blue, indigo, violet) 1; }
            40% { border-image: linear-gradient(72deg, red, orange, yellow, green, blue, indigo, violet) 1; }
            60% { border-image: linear-gradient(108deg, red, orange, yellow, green, blue, indigo, violet) 1; }
            80% { border-image: linear-gradient(144deg, red, orange, yellow, green, blue, indigo, violet) 1; }
            100% { border-image: linear-gradient(180deg, red, orange, yellow, green, blue, indigo, violet) 1; }
        }

        /* Dòng chữ chào mừng - to, giữa */
        #welcome-text {
            color: #fff;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255,255,255,0.6);
            text-align: center;
            padding: 0 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        /* ---- HỘP QUÀ (nằm BÊN DƯỚI lớp splash, sẽ bị che khuất) ---- */
        #main-content {
            position: relative;
            z-index: 1; /* thấp hơn splash */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #gift-box {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255,75,43,0.7);
            transition: transform 0.3s, box-shadow 0.3s;
            font-size: 4rem;
            color: #fff;
            user-select: none;
            border: 3px solid #ffd700;
            position: relative;
        }
        #gift-box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(255,75,43,0.9);
        }
        #gift-box:active {
            transform: scale(0.95);
        }
        .gift-label {
            position: absolute;
            bottom: 10px;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.6);
            padding: 3px 12px;
            border-radius: 20px;
            color: #fff;
            border: 1px solid #fff;
            pointer-events: none;
        }

        #gift-content {
            display: none;
            color: #fff;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 30px 50px;
            border-radius: 20px;
            border: 3px solid #ffd700;
            box-shadow: 0 0 60px rgba(255,215,0,0.3);
            margin-top: 30px;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #gift-box.hidden { display: none; }
        #gift-content.show { display: block; }
    </style>
</head>
<body>

    <!-- LỚP SPLASH CHE TẤT CẢ, KỂ CẢ HỘP QUÀ -->
    <div id="splash">
        <div id="welcome-text">🎉 Chào mừng đến với web của ʚTran Trungɞ 🎉</div>
    </div>

    <!-- NỘI DUNG CHÍNH (HỘP QUÀ) - BỊ CHE HOÀN TOÀN BỞI SPLASH -->
    <div id="main-content">
        <div id="gift-box" onclick="openGift()">
            🎁
            <span class="gift-label">Ấn để mở</span>
        </div>
        <div id="gift-content">✨địt con mẹ mày nhìn cái đb quà á quà cái đb tham vl✨</div>
    </div>

    <script>
        // ---- SAU 5 GIÂY, LỚP SPLASH BIẾN MẤT (MỜ DẦN) ----
        setTimeout(function() {
            let splash = document.getElementById('splash');
            if (splash) {
                splash.style.opacity = '0';
                // Sau khi mờ hết, ẩn luôn khỏi luồng hiển thị
                setTimeout(function() {
                    splash.style.display = 'none';
                }, 800);
            }
        }, 5000); // 5000ms = 5 giây

        // ---- HÀM MỞ HỘP QUÀ (chỉ hoạt động sau khi splash biến mất) ----
        function openGift() {
            let box = document.getElementById('gift-box');
            let content = document.getElementById('gift-content');
            if (box && content) {
                box.classList.add('hidden');
                content.classList.add('show');
                // Reset animation để chạy lại
                content.style.animation = 'none';
                setTimeout(() => {
                    content.style.animation = 'fadeInUp 0.6s ease';
                }, 10);
            }
        }
    </script>
</body>
</html>
